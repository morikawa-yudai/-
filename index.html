<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まるっと便｜オフィスの困ったを、ぜんぶ、まるっと。</title>
<meta name="description" content="オフィス移転、買取・リユース、処分・廃棄、清掃、IT・OAサポートまで。オフィスの困りごとをまるっと便がワンストップで解決します。">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.ref-wrap{width:100%;max-width:1440px;margin:0 auto;position:relative;background:#fff;overflow:hidden}
.ref-img{width:100%;height:auto;display:block;opacity:0;transition:opacity .12s linear}
.ref-img.ready{opacity:1}
.ref-hot{position:absolute;display:block;z-index:5;border:0;background:transparent;text-indent:-9999px;overflow:hidden}
.ref-hot:focus-visible{outline:3px solid rgba(0,174,232,.55);outline-offset:-3px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#8aa6b4;font:600 12px/1.4 sans-serif;letter-spacing:.08em;z-index:2}
.loaded .loading{display:none}
/* hotspot positions are percentage-based against the approved 941x1672 reference */
.hot-services{left:35.5%;top:.8%;width:11.5%;height:3.5%}
.hot-cases{left:47.5%;top:.8%;width:10%;height:3.5%}
.hot-reasons{left:57.8%;top:.8%;width:12%;height:3.5%}
.hot-faq{left:70%;top:.8%;width:12%;height:3.5%}
.hot-contact-head{left:81.3%;top:.25%;width:16.6%;height:4.2%}
.hot-contact-hero{left:4.2%;top:19.1%;width:26.5%;height:4%}
.hot-services-hero{left:32.2%;top:19.1%;width:18.5%;height:4%}
.hot-move{left:27.4%;top:35.1%;width:42%;height:10.5%}
.hot-reuse{left:3.2%;top:48%;width:31.5%;height:11.2%}
.hot-dispose{left:65.2%;top:48%;width:31.5%;height:11.2%}
.hot-contact-bottom{left:39%;top:87.5%;width:26.5%;height:4.8%}
@media(max-width:700px){
  .ref-wrap{width:100%;max-width:none}
}
</style>
</head>
<body>
<main class="ref-wrap" id="refWrap" aria-label="まるっと便">
  <div class="loading">DESIGN LOADING...</div>
  <img id="refImage" class="ref-img" alt="まるっと便 オフィスのお悩み解決サイト">
  <a class="ref-hot hot-services" href="#services" aria-label="サービス一覧">サービス一覧</a>
  <a class="ref-hot hot-cases" href="works.html" aria-label="導入事例">導入事例</a>
  <a class="ref-hot hot-reasons" href="#reasons" aria-label="選ばれる理由">選ばれる理由</a>
  <a class="ref-hot hot-faq" href="faq.html" aria-label="よくあるご質問">よくあるご質問</a>
  <a class="ref-hot hot-contact-head" href="contact.html" aria-label="無料で相談する">無料で相談する</a>
  <a class="ref-hot hot-contact-hero" href="contact.html" aria-label="無料で相談する">無料で相談する</a>
  <a class="ref-hot hot-services-hero" href="#services" aria-label="サービスを見る">サービスを見る</a>
  <a class="ref-hot hot-move" href="move.html" aria-label="移転">移転</a>
  <a class="ref-hot hot-reuse" href="reuse.html" aria-label="買取・リユース">買取・リユース</a>
  <a class="ref-hot hot-dispose" href="dispose.html" aria-label="処分・廃棄">処分・廃棄</a>
  <a class="ref-hot hot-contact-bottom" href="contact.html" aria-label="無料で相談する">無料で相談する</a>
  <span id="services" style="position:absolute;top:27.8%;left:0"></span>
  <span id="reasons" style="position:absolute;top:68.8%;left:0"></span>
</main>
<script>
(async()=>{
  const parts=await Promise.all(
    Array.from({length:19},(_,i)=>fetch('/ref/chunk'+String(i+1).padStart(2,'0')+'.txt',{cache:'force-cache'}).then(r=>{
      if(!r.ok) throw new Error('chunk '+(i+1));
      return r.text();
    }))
  );
  const img=document.getElementById('refImage');
  img.onload=()=>{
    img.classList.add('ready');
    document.getElementById('refWrap').classList.add('loaded');
  };
  img.src='data:image/webp;base64,'+parts.join('');
})().catch(()=>{
  document.querySelector('.loading').textContent='ページを再読み込みしてください';
});
</script>
</body>
</html>
