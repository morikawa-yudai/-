<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まるっと便｜オフィスの困ったを、ぜんぶ、まるっと。</title>
<meta name="description" content="オフィス移転、買取・リユース、処分・廃棄、清掃、IT・OAサポートまで。オフィスの困りごとをまるっと便がワンストップで解決します。">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#fff}
body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.shell{position:relative;width:min(992px,100vw);margin:0 auto;background:#fff;min-height:100vh;overflow:hidden}
#reference{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.loading{min-height:100vh;display:grid;place-items:center;color:#67747b;font-size:13px;letter-spacing:.03em;background:#fff}
.hotspot{position:absolute;z-index:5;display:block;background:transparent;border:0;border-radius:10px}
.hotspot:focus-visible{outline:3px solid #20b9e8;outline-offset:2px}
.anchor{position:absolute;left:0;width:1px;height:1px;pointer-events:none}
@media(max-width:700px){
  .shell{width:100vw}
  .hotspot{border-radius:6px}
}
</style>
</head>
<body>
<div class="shell">
  <div id="loading" class="loading">まるっと便を読み込み中...</div>
  <img id="reference" alt="まるっと便 オフィスサポートサイト" hidden>

  <span id="services" class="anchor" style="top:28%"></span>
  <span id="reasons" class="anchor" style="top:73%"></span>

  <a class="hotspot" href="contact.html" aria-label="無料で相談する"
     style="left:76%;top:.7%;width:20%;height:3.6%"></a>
  <a class="hotspot" href="contact.html" aria-label="無料で相談する"
     style="left:4.4%;top:20.0%;width:26%;height:3.9%"></a>
  <a class="hotspot" href="#services" aria-label="サービスを見る"
     style="left:31%;top:20.0%;width:20%;height:3.9%"></a>

  <a class="hotspot" href="move.html" aria-label="移転サービス"
     style="left:27%;top:35.6%;width:42%;height:11.8%"></a>
  <a class="hotspot" href="reuse.html" aria-label="買取・リユース"
     style="left:2.2%;top:48.2%;width:34%;height:11.8%"></a>
  <a class="hotspot" href="dispose.html" aria-label="処分・廃棄"
     style="left:63.5%;top:48.2%;width:34%;height:11.8%"></a>

  <a class="hotspot" href="#reasons" aria-label="選ばれる理由"
     style="left:28%;top:70.4%;width:44%;height:4%"></a>

  <a class="hotspot" href="contact.html" aria-label="無料で相談する"
     style="left:38%;top:90.3%;width:29%;height:3.7%"></a>
  <a class="hotspot" href="tel:0488789116" aria-label="電話で相談する"
     style="left:68%;top:90.3%;width:27%;height:3.7%"></a>
</div>

<script>
(async()=>{
  const img=document.getElementById('reference');
  const loading=document.getElementById('loading');
  try{
    const files=Array.from({length:21},(_,i)=>'ref/chunk'+String(i+1).padStart(2,'0')+'.txt');
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'force-cache'});
      if(!response.ok) throw new Error('failed: '+file);
      parts.push((await response.text()).trim());
    }
    img.onload=()=>{
      loading.remove();
      img.hidden=false;
    };
    img.onerror=()=>{throw new Error('image decode failed')};
    img.src='data:image/webp;base64,'+parts.join('');
  }catch(error){
    console.error(error);
    loading.textContent='読み込みに失敗しました。ページを再読み込みしてください。';
  }
})();
</script>
</body>
</html>
