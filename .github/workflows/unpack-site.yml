name: Unpack Marutto site
on:
  push:
    branches: [main]
    paths:
      - "package/part09.b64"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild package
        run: |
          cat package/part*.b64 | tr -d '\n' | base64 -d > marutto-deploy.zip
      - name: Unpack site
        run: |
          unzip -o marutto-deploy.zip
          rm -rf package marutto-deploy.zip
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy complete Marutto site from package" || exit 0
          git push
